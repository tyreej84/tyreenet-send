# A complete ProjectSend install using the official image.
#
#   1. Edit the passwords and APP_URL below.
#   2. docker compose -f compose.example.yaml up -d
#   3. Open APP_URL — the setup screen creates your administrator account.
#
# This is the file the Docker Hub description points at, so it is written
# for someone who has never seen the project before.

name: tyreenet-send

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  app:
    # Pin this to the sha-* tag produced for the release you tested. Do not
    # deploy mutable `latest` in production.
    image: ghcr.io/tyreej84/tyreenet-send:${TYREENET_SEND_TAG:?Set TYREENET_SEND_TAG to a tested sha-* image tag}
    restart: unless-stopped
    stop_grace_period: 65m
    logging: *default-logging
    ports:
      # Main-server nginx terminates TLS and proxies send.tyreenet.com over
      # the internal network to this host. The host firewall must restrict
      # this published port to the nginx server.
      - "0.0.0.0:9675:80"
    environment:
      APP_NAME: TyreeNet Send
      APP_URL: https://send.tyreenet.com
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      SESSION_SECURE_COOKIE: "true"

      # Generated on first boot and kept on the storage volume. Set it
      # explicitly if you manage secrets elsewhere — but never change it on
      # a running install: it decrypts existing data.
      # APP_KEY: base64:...

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: projectsend
      DB_USERNAME: projectsend
      DB_PASSWORD: change-me-database

      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Mail is easier to configure from System → Settings → Email once you
      # are logged in — it has a "send test" button. These are the fallback
      # until then.
      MAIL_MAILER: smtp
      MAIL_HOST: smtppro.zoho.com
      MAIL_PORT: "587"
      MAIL_USERNAME: no-reply@tyreenet.com
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: no-reply@tyreenet.com
      MAIL_FROM_NAME: TyreeNet Send

      # Required whenever anything sits between your visitors and this
      # container — which includes the reverse proxy you should be running.
      # Without it every visitor appears to come from the proxy: the login
      # rate limiter treats all of your users as one attacker, and the
      # download log records the proxy's address.
      # Set this in the deployment .env to the main nginx server's internal
      # IP. Do not use "*" now that port 9675 is reachable on the LAN.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?Set TRUSTED_PROXIES to the main nginx server LAN IP}

      MALWARE_SCAN_ENABLED: "true"
      MALWARE_SCAN_FAIL_CLOSED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT: "300"

      # Optional: uncomment these — with a password of your own — to create
      # the first administrator unattended and skip the setup screen. Left
      # commented, the setup screen creates it instead. Ignored once any
      # user exists.
      # ADMIN_NAME: Administrator
      # ADMIN_EMAIL: admin@example.com
      # ADMIN_PASSWORD: change-me-admin
    volumes:
      # Every uploaded file lives here, along with the generated APP_KEY.
      # This is the volume to back up; losing it loses the data.
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: projectsend
      MYSQL_USER: projectsend
      MYSQL_PASSWORD: change-me-database
      MYSQL_ROOT_PASSWORD: change-me-root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # The app waits for this before migrating, so a slow first start is
      # normal rather than a failure.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - clamav-data:/var/lib/clamav
    environment:
      # TyreeNet Send officially accepts/scans files up to 1 GiB. Keep the
      # application's System -> Settings -> Uploads limit at or below 1024 MB.
      CLAMD_CONF_StreamMaxLength: 1G
      CLAMD_CONF_MaxFileSize: 1G
      CLAMD_CONF_MaxScanSize: 1G
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  storage:
  db-data:
  redis-data:
  clamav-data:
