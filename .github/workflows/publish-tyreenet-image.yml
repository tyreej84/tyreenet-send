name: Publish TyreeNet Send image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-tyreenet-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, ldap, pdo_mysql, redis, zip
          coverage: none

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build production frontend
        run: |
          npm ci
          npm run build

      - name: Assemble production image context
        run: |
          mkdir -p image-context/app image-context/docker
          rsync -a \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='image-context' \
            --exclude='node_modules' \
            --exclude='tests' \
            ./ image-context/app/
          cp -a docker/production image-context/docker/production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tyreenet-send
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=TyreeNet Send
            org.opencontainers.image.description=TyreeNet's customized ProjectSend file-delivery service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/TYREENET_PRODUCTION.md
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.vendor=TyreeNet
            org.opencontainers.image.base.name=docker.io/projectsend/projectsend:2

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: image-context/docker/production/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
