version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/New_York }
    groups:
      php-dependencies: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:15", timezone: America/New_York }
    groups:
      frontend-dependencies: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /docker/production
    schedule: { interval: weekly, day: monday }
